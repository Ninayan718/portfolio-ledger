var KEY="pfledger.v1";
var S=null, TAB="overview", FILTER="全部", Q="", EXPAND={}, GMODE="ty";
var TYORDER=["股票","场内ETF","可转债","场外基金","投顾组合","银行理财"];
var TYNAME={"场内ETF":"ETF（场内）","场外基金":"基金（场外）","投顾组合":"基金（投顾）","银行理财":"银行理财"};

/* ========== 工具 ========== */
function money(v){var s=(Math.abs(v)).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");return (v<0?"-":"")+s;}
function wan(v){return (v/10000).toFixed(2)+"万";}
function pct(v,d){return (v*100).toFixed(d===undefined?2:d)+"%";}
function signed(v){return (v>0?"+":"")+money(v);}
function cls(v){return v>0?"up":(v<0?"down":"flat");}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* ========== 存储 ========== */
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);}}catch(e){}
  var DEF={eq:.55,cb:.05,fx:.40,tp:.30,sl:-.25,small:5000,maxPos:.08,auto:1};
  if(!S)S={v:1,dv:2,holdings:JSON.parse(JSON.stringify(SEED)),snaps:[],set:DEF,last:""};
  if(!S.holdings||!S.holdings.length)S.holdings=JSON.parse(JSON.stringify(SEED));
  if(!S.set)S.set=DEF;
  if(!S.snaps)S.snaps=[];
  S.holdings.forEach(function(h,i){if(!h.id)h.id="h"+i;});
  /* 数据版本迁移：真实平台名 + 补齐基金代码/份额/最新净值 */
  if(S.dv!==3){
    var M={};SEED.forEach(function(s){M[s.n]=s;});
    S.holdings.forEach(function(h){
      var s=M[h.n];if(!s)return;
      h.acc=s.acc;
      if(/^\d{6}$/.test(s.c||"")){
        h.c=s.c;h.src=s.src;
        if(s.shares!=null){h.shares=s.shares;h.p=s.p;h.navDate=s.navDate;h.mv=s.mv;delete h.qty;delete h.cu;}
        else if(s.qty!=null){h.qty=s.qty;h.cu=s.cu;h.p=s.p;h.navDate=null;delete h.mv;}
      }
    });
    S.dv=3;save();
  }
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){alert("保存失败：存储空间不足");}}
function snap(){
  var t=calc();var d=today();
  var last=S.snaps[S.snaps.length-1];
  if(last&&last.d===d){last.total=t.total;last.pl=t.pl;}
  else{S.snaps.push({d:d,total:t.total,pl:t.pl});if(S.snaps.length>400)S.snaps.shift();}
}

/* ========== 计算 ========== */
function calc(){
  var h=S.holdings,total=0,cost=0,day=0,byCat={},byAcc={},byAccPL={},byAccN={},byTh={},byTy={},byTyPL={},byTyN={};
  h.forEach(function(x){
    var mv,ct;
    if(x.qty!=null&&x.qty!==""&&x.p!=null){mv=x.qty*x.p;ct=(x.cu!=null?x.qty*x.cu:(x.ct||0));}
    else{mv=x.mv||0;ct=x.ct||0;}
    if(x.prev!=null&&x.p!=null&&x.qty!=null){day+=(x.p-x.prev)*x.qty;}
    else{day+=(x.day||0);}
    x._mv=mv;x._ct=ct;x._pl=mv-ct;
    total+=mv;cost+=ct;
    byCat[x.cat]=(byCat[x.cat]||0)+mv;
    byAcc[x.acc]=(byAcc[x.acc]||0)+mv;
    byAccPL[x.acc]=(byAccPL[x.acc]||0)+x._pl;
    byAccN[x.acc]=(byAccN[x.acc]||0)+1;
    byTh[x.th]=(byTh[x.th]||{mv:0,n:0});byTh[x.th].mv+=mv;byTh[x.th].n++;
    byTy[x.ty]=(byTy[x.ty]||0)+mv;byTyPL[x.ty]=(byTyPL[x.ty]||0)+x._pl;byTyN[x.ty]=(byTyN[x.ty]||0)+1;
  });
  return {total:total,cost:cost,pl:total-cost,day:day,byCat:byCat,byAcc:byAcc,byAccPL:byAccPL,byAccN:byAccN,byTh:byTh,byTy:byTy,byTyPL:byTyPL,byTyN:byTyN};
}
/* 按平台汇总，市值从大到小 */
function accList(t){
  return Object.keys(t.byAcc).map(function(k){
    return {k:k,mv:t.byAcc[k],pl:t.byAccPL[k]||0,n:t.byAccN[k]||0};
  }).sort(function(a,b){return b.mv-a.mv;});
}
/* 按类型汇总，按固定顺序 */
function tyList(t){
  var ks=Object.keys(t.byTy);
  ks.sort(function(a,b){
    var ia=TYORDER.indexOf(a),ib=TYORDER.indexOf(b);
    if(ia!==ib)return (ia<0?99:ia)-(ib<0?99:ib);
    return t.byTy[b]-t.byTy[a];
  });
  return ks.map(function(k){return {k:k,mv:t.byTy[k],pl:t.byTyPL[k]||0,n:t.byTyN[k]||0};});
}

/* ========== 信号 ========== */
function tyGroup(x){
  if(x.ty==="股票")return "股票";
  if(x.ty==="场内ETF")return "ETF";
  if(x.ty==="可转债")return "可转债";
  if(x.ty==="场外基金"||x.ty==="投顾组合")return "基金";
  if(x.ty==="银行理财")return "理财";
  return "其他";
}
var SGGROUP=["大类配置","股票","ETF","可转债","基金","理财","行业重叠","其他"];
function signals(){
  var t=calc(),out=[],st=S.set;
  var catTarget={"权益":st.eq,"可转债":st.cb,"固收":st.fx};
  Object.keys(catTarget).forEach(function(k){
    var cur=(t.byCat[k]||0)/t.total,diff=catTarget[k]-cur;
    if(Math.abs(diff)>=0.05){
      out.push({ty:diff>0?"buy":"sell",lv:1,cat:"大类配置",nm:k+"类资产"+(diff>0?"低配":"超配"),
        why:"当前 "+pct(cur,1)+"，目标 "+pct(catTarget[k],1)+"，偏离 "+pct(diff,1),
        amt:Math.abs(diff)*t.total,act:(diff>0?"补仓至目标":"减仓至目标")});
    }
  });
  var hasBroad=S.holdings.some(function(x){return x.th&&x.th.indexOf("宽基")>=0;});
  if(!hasBroad)out.push({ty:"buy",lv:2,cat:"大类配置",nm:"缺少宽基核心底仓",why:"27 只标的里没有一只纯宽基指数，组合进攻全靠行业主题基金",amt:t.total*0.10,act:"先建沪深300/中证A500 底仓"});
  S.holdings.forEach(function(x){
    var share=x._mv/t.total,r=x._ct>0?x._pl/x._ct:0,mv=x._mv,g=tyGroup(x);
    if(x.cat==="固收"){
      if(share>0.15)out.push({ty:"sell",lv:1,cat:g,nm:x.n,why:"单只理财占 "+pct(share,1)+"，超过 15% 上限，需分散",amt:mv-0.15*t.total,act:"转出分散到 2-3 家"});
      return;
    }
    if(mv<st.small&&share<0.01)out.push({ty:"sell",lv:3,cat:g,nm:x.n,why:"碎仓 "+money(mv)+"，占 "+pct(share,2)+"，管理成本高于收益",amt:mv,act:"清仓归拢"});
    if(r>=st.tp)out.push({ty:"sell",lv:2,cat:g,nm:x.n,why:"收益率 "+pct(r,1)+"，触及止盈线 "+pct(st.tp,0),amt:mv/3,act:"止盈 1/3"});
    if(r<=st.sl&&(x.tg.indexOf("出清")>=0||x.tg.indexOf("重点")>=0||x.tg.indexOf("深亏")>=0))
      out.push({ty:"sell",lv:1,cat:g,nm:x.n,why:"收益率 "+pct(r,1)+"，触及止损线 "+pct(st.sl,0)+"，标签："+x.tg,amt:mv,act:"赎回或止损"});
    if(share>st.maxPos)out.push({ty:"sell",lv:2,cat:g,nm:x.n,why:"单仓占 "+pct(share,1)+"，超过 "+pct(st.maxPos,0)+" 上限",amt:mv-st.maxPos*t.total,act:"减至上限"});
  });
  Object.keys(t.byTh).forEach(function(k){

function script(url,timeout){
  return new Promise(function(res,rej){
    var s=document.createElement("script");var done=false;
    var tm=setTimeout(function(){if(!done){done=true;cleanup();rej(new Error("timeout"));}},timeout||9000);
    function cleanup(){clearTimeout(tm);try{s.remove();}catch(e){}}
    s.src=url;s.onerror=function(){if(!done){done=true;cleanup();rej(new Error("err"));}};
    s.onload=function(){setTimeout(function(){if(!done){done=true;cleanup();res();}},60);};
    document.head.appendChild(s);
  });
}
window.__fundData=null;
window.__fundcb=function(o){window.__fundData=o;};
async function fetchFunds(){
  var list=S.holdings.filter(function(h){return h.src==="f"&&/^\d{6}$/.test(h.c);});
  if(!list.length)return {ok:0,fail:0};
  window.__fundData=null;
  var url="https://fundmobapi.eastmoney.com/FundMNewApi/FundMNFInfo?Fcodes="+
    list.map(function(x){return x.c;}).join(",")+
    "&pageIndex=1&pageSize=80&plat=Android&appType=ttjj&product=EFund&Version=1&deviceid=1&callback=__fundcb&_="+Date.now();
  try{await script(url,12000);}catch(e){return {ok:0,fail:list.length};}
  var d=window.__fundData;
  if(!d||!d.Datas)return {ok:0,fail:list.length};
  var map={};d.Datas.forEach(function(o){map[o.FCODE]=o;});
  var ok=0,fail=0;
  list.forEach(function(x){
    var o=map[x.c];if(!o){fail++;return;}
    var nav=parseFloat(o.NAV);
    if(!nav||isNaN(nav)){fail++;return;}
    if(x.shares==null||x.shares===""||isNaN(x.shares))x.shares=(x.mv||0)/nav;
    x.p=nav;
    x.navDate=o.PDATE;
    x.mv=x.shares*nav;
    var est=parseFloat(o.GSZ);
    if(!isNaN(est)&&est>0)x.day=x.shares*(est-nav);
    ok++;
  });
  return {ok:ok,fail:fail};
}
async function fetchStocks(){
  var list=S.holdings.filter(function(h){return h.src&&/^(sh|sz|r_hk|hk)/.test(h.src);});
  if(!list.length)return 0;
  var got=0;
  try{
    await script("https://qt.gtimg.cn/q="+list.map(function(x){return x.src;}).join(","),9000);
    list.forEach(function(x){
      var v=window["v_"+x.src];
      if(!v)return;
      var f=v.split("~");
      if(f.length<6)return;
      var price=parseFloat(f[3]),prev=parseFloat(f[4]);
      if(!price)return;
      x.prev=prev;x.p=price;got++;
    });
  }catch(e){}
  return got;
}

  if(btn){btn.disabled=true;btn.textContent="刷新中…";}
  var a=await fetchStocks().catch(function(){return 0;});
  var f=await fetchFunds().catch(function(){return {ok:0,fail:0};});
  var d=new Date();
  S.last=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  calc();snap();save();render();
  if(btn){btn.disabled=false;btn.textContent="刷新行情";}
  if(!silent)alert("行情已刷新\n· 股票/ETF/转债 "+a+" 只\n· 场外基金 "+f.ok+" 只"+(f.fail?"（"+f.fail+" 只失败）":"")+"\n\n银行理财无公开净值，需手动改市值");
}

/* ========== 启动 ========== */
Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.onclick=function(){go(b.dataset.t);};});
document.getElementById("btnRefresh").onclick=function(){refresh(false);};
load();calc();
(function(){
  var d=today(),last=S.snaps[S.snaps.length-1];
  if(!last||last.d!==d)snap();
})();
save();render();
(function(){
  if(!S.set.auto)return;
  var t=S.last?new Date(S.last.replace(/-/g,"/")).getTime():0;
  if(Date.now()-t>6*3600*1000)refresh(true);
})();
</script>
</body>
</html>
